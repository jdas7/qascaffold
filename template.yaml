schema_version: "1.0"

template:
  id: python-pytestbdd-api
  name: Python Pytest BDD API
  version: "1.0.0"
  description: API test starter for the public PokeAPI Charmander resource using Python, Pytest, pytest-bdd, and Requests.

technology:
  language: python
  framework: pytestbdd
  type: api

requirements:
  runtime: ">=3.11"
  dependencies:
    - pytest
    - pytest-bdd
    - requests

project:
  entry_point: tests/
  install_command: pip install -r requirements.txt
  test_command: pytest
