name: Validate template

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # This repository uses PRs from template branches into main.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed template branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate template
        env:
          TEMPLATE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: python scripts/validate_template.py --branch "$TEMPLATE_BRANCH" --template-dir .
